<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <radialGradient id="paper" cx="50%" cy="44%" r="78%">
      <stop offset="0%" stop-color="#f8f1e1"/>
      <stop offset="58%" stop-color="#f3e9d2"/>
      <stop offset="100%" stop-color="#e9d7b4"/>
    </radialGradient>
    <radialGradient id="vign" cx="50%" cy="46%" r="72%">
      <stop offset="62%" stop-color="#3d1f0a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3d1f0a" stop-opacity="0.12"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5f7044"/>
      <stop offset="100%" stop-color="#3f4e2f"/>
    </linearGradient>
    <path id="lpetal" d="M560 470 C536 420 536 372 560 336 C584 372 584 420 560 470 Z" fill="#d97a6a" stroke="#c9984a" stroke-width="2.5"/>
    <path id="lpetalIn" d="M560 470 C544 434 544 404 560 386 C576 404 576 434 560 470 Z" fill="#e8a9a0" stroke="#e2c189" stroke-width="2"/>
  </defs>

  <rect width="1200" height="800" fill="url(#paper)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.045"/>

  <!-- 金线涟漪 -->
  <g fill="none" stroke="#c9984a">
    <ellipse cx="560" cy="620" rx="300" ry="100" stroke-width="2" opacity="0.5"/>
    <ellipse cx="560" cy="620" rx="235" ry="78" stroke-width="2" opacity="0.4"/>
    <ellipse cx="560" cy="620" rx="170" ry="56" stroke-width="2" opacity="0.3"/>
    <ellipse cx="560" cy="620" rx="105" ry="34" stroke-width="2" opacity="0.22"/>
  </g>

  <!-- 荷花：外八瓣 + 内八瓣 + 莲蓬 -->
  <g>
    <use href="#lpetal"/>
    <use href="#lpetal" transform="rotate(45 560 470)"/>
    <use href="#lpetal" transform="rotate(90 560 470)"/>
    <use href="#lpetal" transform="rotate(135 560 470)"/>
    <use href="#lpetal" transform="rotate(180 560 470)"/>
    <use href="#lpetal" transform="rotate(225 560 470)"/>
    <use href="#lpetal" transform="rotate(270 560 470)"/>
    <use href="#lpetal" transform="rotate(315 560 470)"/>
    <use href="#lpetalIn" transform="rotate(22.5 560 470)"/>
    <use href="#lpetalIn" transform="rotate(67.5 560 470)"/>
    <use href="#lpetalIn" transform="rotate(112.5 560 470)"/>
    <use href="#lpetalIn" transform="rotate(157.5 560 470)"/>
    <use href="#lpetalIn" transform="rotate(202.5 560 470)"/>
    <use href="#lpetalIn" transform="rotate(247.5 560 470)"/>
    <use href="#lpetalIn" transform="rotate(292.5 560 470)"/>
    <use href="#lpetalIn" transform="rotate(337.5 560 470)"/>
    <circle cx="560" cy="470" r="24" fill="#a08a4a" stroke="#8f7a3f" stroke-width="2"/>
    <g fill="#6b4226">
      <circle cx="560" cy="460" r="3"/>
      <circle cx="569" cy="463" r="3"/>
      <circle cx="565" cy="477" r="3"/>
      <circle cx="555" cy="477" r="3"/>
      <circle cx="551" cy="463" r="3"/>
    </g>
  </g>

  <!-- 大荷叶（右） -->
  <g transform="rotate(-12 860 540)">
    <ellipse cx="860" cy="540" rx="210" ry="150" fill="url(#leafGrad)" stroke="#3d1f0a" stroke-width="3"/>
    <path d="M860 540 L700 396 L768 380 Z" fill="#3f4e2f" stroke="#c9984a" stroke-width="2.5"/>
    <g stroke="#c9984a" stroke-width="2" opacity="0.75">
      <line x1="860" y1="540" x2="860" y2="392"/>
      <line x1="860" y1="540" x2="1000" y2="420"/>
      <line x1="860" y1="540" x2="1040" y2="520"/>
      <line x1="860" y1="540" x2="990" y2="632"/>
      <line x1="860" y1="540" x2="880" y2="684"/>
      <line x1="860" y1="540" x2="760" y2="660"/>
      <line x1="860" y1="540" x2="700" y2="590"/>
    </g>
    <circle cx="860" cy="540" r="26" fill="none" stroke="#c9984a" stroke-width="2"/>
  </g>

  <!-- 小荷叶（左） -->
  <g transform="rotate(16 320 660)">
    <ellipse cx="320" cy="660" rx="95" ry="58" fill="url(#leafGrad)" stroke="#3d1f0a" stroke-width="2.5"/>
    <path d="M320 660 L245 622 L278 610 Z" fill="#3f4e2f" stroke="#c9984a" stroke-width="2"/>
    <g stroke="#c9984a" stroke-width="1.6" opacity="0.7">
      <line x1="320" y1="660" x2="320" y2="604"/>
      <line x1="320" y1="660" x2="392" y2="630"/>
      <line x1="320" y1="660" x2="390" y2="700"/>
      <line x1="320" y1="660" x2="280" y2="706"/>
    </g>
  </g>

  <!-- 飘落花瓣 -->
  <g>
    <path d="M800 200 C786 172 786 148 800 132 C814 148 814 172 800 200 Z" fill="#e8a9a0" stroke="#c0392b" stroke-width="1.5" transform="rotate(28 800 200)"/>
    <path d="M880 260 C866 232 866 208 880 192 C894 208 894 232 880 260 Z" fill="#d97a6a" stroke="#c0392b" stroke-width="1.5" transform="rotate(-18 880 260)"/>
  </g>

  <rect width="1200" height="800" fill="url(#vign)"/>
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="#c9984a" stroke-width="2.5" opacity="0.75"/>
  <rect x="38" y="38" width="1124" height="724" fill="none" stroke="#c9984a" stroke-width="1" opacity="0.4"/>
  <g transform="translate(1088 690)">
    <rect width="64" height="64" rx="6" fill="#c0392b" opacity="0.92"/>
    <text x="32" y="46" text-anchor="middle" font-family="STKaiti, KaiTi, SimSun, serif" font-size="40" font-weight="700" fill="#f8f1e1">绣</text>
  </g>
</svg>
